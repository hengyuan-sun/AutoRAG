[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autorag-lab"
version = "0.1.0"
description = "企业文档处理、召回评测与版本发布试验台"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "httpx>=0.28,<1", "python-multipart>=0.0.20", "python-docx>=1.1,<2", "pypdf>=5,<7", "pydantic-settings>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: real PostgreSQL/Ollama services", "e2e: real API and external services"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
